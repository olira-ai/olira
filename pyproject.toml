[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olira"
version = "1.10.0"
description = "Olira Python SDK — event ingestion client for the Olira platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Olira AI", email = "dev@olira.ai" },
]
keywords = ["olira", "health", "sdk", "ingestion", "events"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.urls]
Documentation = "https://docs.olira.ai"

[tool.uv]
# Public deps only: pin default index so `uv run` works when the shell inherits
# UV_INDEX_URL from CodeArtifact (401 without AWS auth breaks resolution).
index-url = "https://pypi.org/simple"

[project.optional-dependencies]
signals = [
    "pyarrow>=15.0",
]
dev = [
    "mypy>=1.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "pyarrow>=15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/olira"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["olira"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
